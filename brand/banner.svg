<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Context Capsule — a browser-side context compiler for coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101F"/>
      <stop offset="0.55" stop-color="#171331"/>
      <stop offset="1" stop-color="#0E0D17"/>
    </linearGradient>

    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#4B3BD8"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2AD9C4" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>

  <!-- Selection frame: the human pointing at a component -->
  <g opacity="0.9">
    <rect x="748" y="86" width="340" height="150" rx="12"
          fill="#7C6BFF" fill-opacity="0.06"
          stroke="#7C6BFF" stroke-width="2"/>

    <g fill="#7C6BFF">
      <rect x="742" y="80" width="12" height="12" rx="3"/>
      <rect x="1082" y="80" width="12" height="12" rx="3"/>
      <rect x="742" y="230" width="12" height="12" rx="3"/>
      <rect x="1082" y="230" width="12" height="12" rx="3"/>
    </g>

    <rect x="746" y="56" width="30" height="24" rx="7" fill="#7C6BFF"/>
    <text x="761" y="73" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">A</text>

    <!-- Evidence rails leaving the selection -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="12.5" fill="#8B8AA6">
      <rect x="772" y="112" width="150" height="9" rx="4.5" fill="#F7F7FB" fill-opacity="0.14"/>
      <rect x="772" y="132" width="240" height="9" rx="4.5" fill="#F7F7FB" fill-opacity="0.09"/>
      <rect x="772" y="152" width="196" height="9" rx="4.5" fill="#F7F7FB" fill-opacity="0.09"/>
      <rect x="772" y="188" width="86" height="26" rx="7" fill="#2AD9C4" fill-opacity="0.16"/>
      <text x="784" y="205" fill="#2AD9C4">200 OK</text>
    </g>
  </g>

  <!-- Mark -->
  <g transform="translate(72 104) scale(0.875)">
    <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#field)"/>
    <g transform="rotate(-45 64 64)">
      <rect x="30" y="46" width="68" height="36" rx="18"
            fill="none" stroke="#F7F7FB" stroke-width="9"/>
      <line x1="64" y1="46" x2="64" y2="82" stroke="#F7F7FB" stroke-width="5" opacity="0.55"/>
    </g>
    <circle cx="64" cy="64" r="11" fill="#2AD9C4"/>
    <circle cx="64" cy="64" r="11" fill="none" stroke="#0E0D17" stroke-width="3.5" opacity="0.35"/>
  </g>

  <text x="212" y="140"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1.4" fill="#F7F7FB">Context Capsule</text>

  <text x="214" y="178"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="0.5" fill="#7C6BFF">point at the bug · ship the evidence</text>

  <text x="214" y="216"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="16.5" fill="#8B8AA6">Select any part of a live web app and package everything</text>

  <text x="214" y="240"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="16.5" fill="#8B8AA6">a coding agent needs to understand it.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <g fill="#8B8AA6">
      <rect x="214" y="262" width="92" height="26" rx="13" fill="#F7F7FB" fill-opacity="0.06"/>
      <text x="230" y="279">local-only</text>

      <rect x="316" y="262" width="66" height="26" rx="13" fill="#F7F7FB" fill-opacity="0.06"/>
      <text x="332" y="279">MV3</text>

      <rect x="392" y="262" width="62" height="26" rx="13" fill="#F7F7FB" fill-opacity="0.06"/>
      <text x="408" y="279">MCP</text>

      <rect x="464" y="262" width="102" height="26" rx="13" fill="#F7F7FB" fill-opacity="0.06"/>
      <text x="480" y="279">no cloud</text>
    </g>
  </g>
</svg>
