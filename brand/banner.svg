<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Context Capsule — point at the bug, ship the evidence. Select any part of a live web app and package everything a coding agent needs to understand it.">
  <title>Context Capsule</title>

  <!--
    Editorial brutalism, per extension/tokens.css: paper field, heavy black
    display type, one loud yellow. Hard edges only - roundness is reserved for
    pills and the mark. Shadows are offset planes, never blur.

    Colour meaning is fixed and never swaps:
      yellow  the thing to press next
      black   structure, primary action
      blue    a tool you are holding
      red     your annotation, and destructive actions
      green   a confirmed fact
  -->

  <defs>
    <pattern id="rule" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 L7 0" stroke="#0a0a0a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Field -->
  <rect width="1200" height="420" fill="#f4f2ed"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#rule)"/>

  <!-- Tape band: the black structural rule the panel uses as a header -->
  <rect x="0" y="0" width="1200" height="14" fill="#0a0a0a"/>
  <rect x="0" y="406" width="1200" height="14" fill="#0a0a0a"/>

  <!-- ═════════════════ Left: identity ═════════════════ -->

  <!-- Mark: the capsule with a wedge taken out, reticle at centre.
       Geometry matches mark.svg and tools/build-icons.mjs exactly. -->
  <g transform="translate(64 56) scale(0.72)">
    <rect x="6" y="6" width="128" height="128" rx="10" fill="#0a0a0a"/>
    <rect x="0" y="0" width="128" height="128" rx="10" fill="#ffe047"/>
    <path fill="#0a0a0a" d="M64 64 L23.89 55.44 A41 41 0 1 0 44.75 100.15 Z"/>
    <circle cx="64" cy="64" r="11" fill="#ffe047"/>
  </g>

  <text x="64" y="224"
        font-family="Archivo, 'Helvetica Neue', Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="52" font-weight="900" letter-spacing="-2" fill="#0a0a0a">CONTEXT CAPSULE</text>

  <!-- Tagline sits on the yellow, because it is the line that carries the promise -->
  <rect x="64" y="242" width="404" height="28" fill="#ffe047"/>
  <text x="76" y="261"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#0a0a0a">POINT AT THE BUG — SHIP THE EVIDENCE</text>

  <text x="64" y="300"
        font-family="Archivo, 'Helvetica Neue', Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="17" fill="#3d3d3d">Select any part of a live web app and package everything</text>
  <text x="64" y="324"
        font-family="Archivo, 'Helvetica Neue', Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="17" fill="#3d3d3d">a coding agent needs to understand it.</text>

  <!-- Capability chips: pills are the one place roundness is allowed -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12" font-weight="700" fill="#0a0a0a">
    <rect x="64" y="348" width="98" height="26" rx="13" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <text x="113" y="365" text-anchor="middle">LOCAL-ONLY</text>

    <rect x="170" y="348" width="60" height="26" rx="13" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <text x="200" y="365" text-anchor="middle">MV3</text>

    <rect x="238" y="348" width="88" height="26" rx="13" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <text x="282" y="365" text-anchor="middle">NO CLOUD</text>

    <rect x="334" y="348" width="98" height="26" rx="13" fill="none" stroke="#0a0a0a" stroke-width="2"/>
    <text x="383" y="365" text-anchor="middle">REDACTION</text>
  </g>

  <!-- ═════════════════ Middle: the region you drew ═════════════════ -->

  <g>
    <!-- Selection marquee: red is your annotation, per the colour contract -->
    <rect x="530" y="120" width="150" height="112"
          fill="#ffffff" stroke="#ff4d3d" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Handles -->
    <g fill="#ff4d3d">
      <rect x="524" y="114" width="10" height="10"/>
      <rect x="676" y="114" width="10" height="10"/>
      <rect x="524" y="228" width="10" height="10"/>
      <rect x="676" y="228" width="10" height="10"/>
    </g>

    <!-- Selection ID badge -->
    <rect x="524" y="94" width="24" height="22" fill="#ff4d3d"/>
    <text x="536" y="110" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" font-weight="700" fill="#ffffff">A</text>

    <!-- The component inside the marquee -->
    <g>
      <rect x="546" y="140" width="86" height="9" fill="#0a0a0a" fill-opacity="0.72"/>
      <rect x="546" y="158" width="118" height="9" fill="#0a0a0a" fill-opacity="0.22"/>
      <rect x="546" y="176" width="64" height="9" fill="#0a0a0a" fill-opacity="0.22"/>
      <rect x="546" y="198" width="54" height="20" fill="#ff4d3d" fill-opacity="0.18" stroke="#ff4d3d" stroke-width="1.5"/>
    </g>

    <!-- Rail into the capsule -->
    <path d="M694 176 H736" stroke="#0a0a0a" stroke-width="2"/>
    <path d="M730 169 L742 176 L730 183 Z" fill="#0a0a0a"/>
  </g>

  <!-- ═════════════════ Right: the panel ═════════════════ -->

  <g>
    <!-- Offset shadow plane, then the card -->
    <rect x="762" y="66" width="382" height="288" fill="#0a0a0a"/>
    <rect x="756" y="60" width="382" height="288" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>

    <!-- Panel header: black tape band -->
    <rect x="756" y="60" width="382" height="38" fill="#0a0a0a"/>
    <text x="774" y="85"
          font-family="Archivo, 'Helvetica Neue', Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="15" font-weight="800" letter-spacing="0.4" fill="#ffffff">CONTEXT CAPSULE</text>
    <rect x="1058" y="70" width="64" height="18" fill="#1faa5f"/>
    <text x="1090" y="83" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#ffffff">ARMED</text>

    <!-- Four numbered steps: the panel reads like a printed worksheet -->
    <g font-family="Archivo, 'Helvetica Neue', Inter, ui-sans-serif, system-ui, sans-serif"
       font-size="14.5" font-weight="600" fill="#0a0a0a">
      <rect x="776" y="118" width="22" height="22" fill="#ffe047"/>
      <text x="787" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0a0a">1</text>
      <text x="810" y="134">Select and mark</text>

      <rect x="776" y="164" width="22" height="22" fill="#ffe047"/>
      <text x="787" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0a0a">2</text>
      <text x="810" y="180">Describe the change</text>

      <rect x="776" y="210" width="22" height="22" fill="#ffe047"/>
      <text x="787" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0a0a">3</text>
      <text x="810" y="226">Capture the evidence</text>

      <rect x="776" y="256" width="22" height="22" fill="#ffe047"/>
      <text x="787" y="272" text-anchor="middle" font-size="13" font-weight="800" fill="#0a0a0a">4</text>
      <text x="810" y="272">Export to your agent</text>
    </g>

    <!-- Counts: numbers beat adjectives in an evidence tool -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7a7873">
      <text x="1122" y="134" text-anchor="end" fill="#ff4d3d">3 selections</text>
      <text x="1122" y="180" text-anchor="end">1 intent</text>
      <text x="1122" y="226" text-anchor="end" fill="#1faa5f">37 events · 18 req</text>
      <text x="1122" y="272" text-anchor="end" fill="#1faa5f">sealed</text>
    </g>

    <!-- Footer: what the capsule contains -->
    <line x1="756" y1="296" x2="1138" y2="296" stroke="#d8d5cc" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7a7873">
      <text x="776" y="316">screenshot · DOM · computed CSS · a11y</text>
      <text x="776" y="334">console · network · storage · redaction report</text>
    </g>
  </g>
</svg>
