<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Context Capsule mark">
  <!--
    Two flat colours, hard edges, no gradient. The mark has to survive being
    16 pixels wide in a browser toolbar, so nothing in it is subtle.

    tools/build-icons.mjs reproduces this geometry analytically — the wedge is
    the arc from 192deg round to 118deg. Change one and change the other.
  -->

  <!-- Field: the tile, matching the panel's hard-edged cards -->
  <rect x="0" y="0" width="128" height="128" rx="10" fill="#FFE047"/>

  <!--
    The capsule: a disc with a wedge taken out of it — a container with its
    contents extracted, open toward the thing it took them from.
  -->
  <path fill="#0A0A0A"
        d="M64 64 L23.90 55.48 A41 41 0 1 1 44.75 100.20 Z"/>

  <!-- Reticle: the human pointing at the exact thing -->
  <circle cx="64" cy="64" r="11" fill="#FFE047"/>
</svg>
